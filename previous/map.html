<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Locality map — OpenStreetMap</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#e3e9de;font:12px sans-serif}#map{position:absolute;inset:0;cursor:grab;touch-action:none;overflow:hidden}#tiles{position:absolute;inset:0}img{position:absolute;width:256px;height:256px;user-select:none;pointer-events:none}#controls{position:absolute;top:14px;left:14px;display:grid;gap:2px}button{background:white;border:1px solid #bbb;border-radius:4px;width:33px;height:33px;font-size:22px;cursor:pointer}footer{position:absolute;bottom:0;right:0;background:#fffe;padding:4px;font-size:10px}a{color:#234e3f}#pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:34px;color:#a13f28;text-shadow:0 2px 2px #fff;pointer-events:none}#status{position:absolute;bottom:30px;left:12px;background:#ffffffe8;padding:6px;border-radius:4px;font-size:10px}</style><div id="map" role="region" aria-label="Interactive locality map. Drag to pan; use zoom controls."><div id="tiles"></div><span id="pin" aria-label="Approximate locality marker">●</span></div><div id="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button></div><span id="status">Drag to pan · + / − to zoom</span><footer>© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a></footer><script>
const params=new URLSearchParams(location.search);let lat=Number(params.get('lat')||12.87),lon=Number(params.get('lon')||77.60),z=Number(params.get('z')||11);if(!Number.isFinite(lat)||!Number.isFinite(lon)){lat=12.87;lon=77.60}let x,y;const map=document.getElementById('map'),tiles=document.getElementById('tiles');function project(){const n=2**z;x=(lon+180)/360*n*256;y=(1-Math.asinh(Math.tan(lat*Math.PI/180))/Math.PI)/2*n*256}function draw(){const w=innerWidth,h=innerHeight,n=2**z;tiles.replaceChildren();let errors=0;for(let i=Math.floor((x-w/2)/256);i<=Math.floor((x+w/2)/256);i++)for(let j=Math.floor((y-h/2)/256);j<=Math.floor((y+h/2)/256);j++){if(j<0||j>=n)continue;const tile=document.createElement('img');tile.alt='';tile.draggable=false;tile.src=`https://tile.openstreetmap.org/${z}/${((i%n)+n)%n}/${j}.png`;tile.style.left=(i*256-x+w/2)+'px';tile.style.top=(j*256-y+h/2)+'px';tile.onerror=()=>{if(++errors>2)document.getElementById('status').textContent='Map tiles unavailable. Use Explore full map.'};tiles.append(tile)}}function zoom(d){z=Math.max(3,Math.min(18,z+d));project();draw()}document.getElementById('plus').onclick=()=>zoom(1);document.getElementById('minus').onclick=()=>zoom(-1);let drag;map.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,cx:x,cy:y};map.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(!drag)return;x=drag.cx-(e.clientX-drag.x);y=drag.cy-(e.clientY-drag.y);tiles.style.transform=`translate(${e.clientX-drag.x}px,${e.clientY-drag.y}px)`;document.getElementById('pin').hidden=true};map.onpointerup=()=>{if(!drag)return;drag=null;lon=x/(2**z*256)*360-180;lat=Math.atan(Math.sinh(Math.PI*(1-2*y/(2**z*256))))*180/Math.PI;tiles.style.transform='';draw()};addEventListener('resize',draw);project();draw();
</script></html>
